# Ships a version on every push to main that holds a feature, a fix or a
# breaking change. The version comes from the Conventional Commits since the
# last `vX.Y.Z` tag (.github/scripts/release.mjs). The builds make ferryd (the
# dashboard inside) and ferry for Linux x86_64 and arm64, and ferry alone for
# macOS Apple Silicon and Intel; install.sh installs the Linux ones on a fresh
# Ubuntu 22.04 and 26.04 of each CPU, and npm installs the ferry-cli packages
# made from them on each system. The publish job tags and publishes the
# release, only after every asset is built and checked: a release has the
# archives of all the systems, or there is no release. Then npm gets ferry-cli
# at the same version, when the CLI changed since the version npm has
# (npm/README.md).
name: Release

on:
  push:
    branches: [main]
  # A change to the release itself is built and checked, never published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release.mjs
      - .github/scripts/install.test.sh
      - .github/scripts/npm.mjs
      - install.sh
      - npm/**
  workflow_dispatch:

# One release at a time, in push order: each run reads the tag of the one before.
# Pushes get their own group, so a manual run never replaces a waiting release.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Same toolchain as ci.yml.
  RUST_TOOLCHAIN: "1.95.0"
  # One archive per build of the build and build-macos matrices. Asset names
  # carry no version, so releases/latest/download/<name> always works.
  ARCHIVES: >-
    ferry-x86_64-unknown-linux-gnu.tar.gz
    ferry-aarch64-unknown-linux-gnu.tar.gz
    ferry-aarch64-apple-darwin.tar.gz
    ferry-x86_64-apple-darwin.tar.gz

jobs:
  plan:
    name: Next version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag since the last release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          PUBLISH: ${{ github.event_name == 'push' && '--publish' || '' }}
        run: node .github/scripts/release.mjs plan --notes "$RUNNER_TEMP/notes.md" $PUBLISH | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ "$RELEASE" = true ]; then
            echo "::notice title=Release $TAG::$REASON"
            { echo "## Release $TAG"; echo; echo "$REASON"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=No release::$REASON"
            { echo "## No release"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  build:
    name: Build — Linux ${{ matrix.cpu }}
    needs: plan
    # Pull requests and manual runs always build: that is what they check.
    if: needs.plan.outputs.release == 'true' || github.event_name != 'push'
    strategy:
      # Each build reports, even when the other one fails. Either failure stops the release.
      fail-fast: false
      matrix:
        include:
          - cpu: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - cpu: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    # glibc 2.35: the binaries also run on Ubuntu 22.04 and Debian 12 (glibc 2.36).
    # Each CPU builds on a runner of that CPU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      ARCHIVE: ferry-${{ matrix.target }}.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ferryd embeds web/dist when it compiles (DESIGN.md §13): build it first,
      # or the binary serves the placeholder page.
      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
          test -f dist/index.html
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # In this checkout only: the repository keeps its version, nothing is committed back.
      - name: Set the version
        run: |
          node .github/scripts/release.mjs set-version "$VERSION"
          cargo update --workspace
      # --target: on a runner of another CPU, the build fails. It never puts
      # binaries of one CPU in the archive of another.
      - name: Build ferryd and ferry
        run: cargo build --release --locked --target "$TARGET" -p ferryd -p ferry-cli

      - name: Check the version and glibc
        working-directory: target/${{ matrix.target }}/release
        run: |
          for bin in ferryd ferry; do
            printed=$(./$bin --version)
            if [ "$printed" != "$bin $VERSION" ]; then
              echo "::error::$bin --version printed '$printed', not '$bin $VERSION'"
              exit 1
            fi
            glibc=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
            echo "$bin needs glibc $glibc"
            if [ "$(printf '%s\n' "$glibc" 2.35 | sort -V | tail -n 1)" != 2.35 ]; then
              echo "::error::$bin needs glibc $glibc: Ubuntu 22.04 has 2.35"
              exit 1
            fi
          done
      # Docker pulls the images of the runner's CPU.
      - name: Run on Ubuntu 22.04 and Debian 12
        run: |
          for image in ubuntu:22.04 debian:12; do
            for bin in ferryd ferry; do
              docker run --rm -v "$PWD/target/$TARGET/release:/ferry:ro" "$image" "/ferry/$bin" --version
            done
          done
      - name: Serve the dashboard
        run: |
          data="$RUNNER_TEMP/ferry-data"
          "./target/$TARGET/release/ferryd" run --data-dir "$data" > "$RUNNER_TEMP/ferryd.out" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null; wait $pid 2>/dev/null; echo "--- ferryd output"; cat "$RUNNER_TEMP/ferryd.out"' EXIT
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:7878/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          fail() { echo "::error::$1"; exit 1; }

          # The built dashboard, with its own scripts, not the placeholder page.
          curl -fsS http://127.0.0.1:7878/ > "$RUNNER_TEMP/index.html"
          if grep -q 'name="ferry-ui" content="placeholder"' "$RUNNER_TEMP/index.html"; then
            fail "ferryd serves the placeholder page, not the dashboard"
          fi
          script=$(grep -o '/assets/[^"]*\.js' "$RUNNER_TEMP/index.html" | head -n 1 || true)
          [ -n "$script" ] || fail "the page at / loads no script from /assets"
          curl -fsS -o /dev/null "http://127.0.0.1:7878$script" || fail "$script is not served"

          # The version, everywhere ferryd reports it.
          token=$(cat "$data/api_token")
          info=$(curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:7878/api/v1/info | jq -r .version)
          openapi=$(curl -fsS http://127.0.0.1:7878/api/openapi.json | jq -r .info.version)
          state=$(jq -r .version "$data/ferryd.json")
          echo "/api/v1/info: $info, OpenAPI: $openapi, ferryd.json: $state"
          for v in "$info" "$openapi" "$state"; do
            [ "$v" = "$VERSION" ] || fail "ferryd reports version $v, not $VERSION"
          done

      - name: Package
        run: |
          mkdir dist
          # Owned by root: `sudo tar -x` keeps the owner of the archive, and the
          # runner's uid can be a login user on a server.
          tar --owner=0 --group=0 --numeric-owner -czf "dist/$ARCHIVE" \
            -C "target/$TARGET/release" ferryd ferry -C "$GITHUB_WORKSPACE" LICENSE
          tar -tzvf "dist/$ARCHIVE" --numeric-owner
          if tar -tzvf "dist/$ARCHIVE" --numeric-owner | awk '$2 != "0/0" { bad = 1 } END { exit !bad }'; then
            echo "::error::$ARCHIVE has files not owned by 0/0"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ferry alone: ferryd runs on Linux only.
  build-macos:
    name: Build — macOS ${{ matrix.cpu }} (CLI)
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - cpu: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    # Each CPU builds on a runner of that CPU, and the binary runs there.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      CPU: ${{ matrix.cpu }}
      ARCHIVE: ferry-${{ matrix.target }}.tar.gz
      # The oldest macOS the binary runs on. The linker writes it in the
      # binary (minos), and the C code of SQLite and ring is built for it too.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # In this checkout only, as on Linux.
      - name: Set the version
        run: |
          node .github/scripts/release.mjs set-version "$VERSION"
          cargo update --workspace
      - name: Build ferry
        run: cargo build --release --locked --target "$TARGET" -p ferry-cli

      # Apple Silicon runs signed code only: the run also checks that `strip`
      # (profile.release) left the linker's signature valid.
      - name: Check the version, the CPU and the macOS version
        working-directory: target/${{ matrix.target }}/release
        run: |
          fail() { echo "::error::$1"; exit 1; }
          printed=$(./ferry --version)
          [ "$printed" = "ferry $VERSION" ] || fail "ferry --version printed '$printed', not 'ferry $VERSION'"
          archs=$(lipo -archs ferry)
          [ "$archs" = "$CPU" ] || fail "ferry is built for '$archs', not $CPU"
          # awk reads to the end: an early exit would stop otool with SIGPIPE (pipefail).
          minos=$(otool -l ferry | awk '$1 == "minos" && !found { print $2; found = 1 }')
          echo "ferry needs macOS $minos"
          [ "$minos" = "$MACOSX_DEPLOYMENT_TARGET" ] || fail "ferry needs macOS $minos, not $MACOSX_DEPLOYMENT_TARGET"

      - name: Package
        run: |
          mkdir dist
          # Owned by root, as on Linux. No macOS metadata: no ._ files
          # (COPYFILE_DISABLE) and no extended attributes, which `sudo tar -x`
          # would put back on the user's files.
          COPYFILE_DISABLE=1 tar --uid 0 --gid 0 --numeric-owner --no-xattrs -czf "dist/$ARCHIVE" \
            -C "target/$TARGET/release" ferry -C "$GITHUB_WORKSPACE" LICENSE
          # bsdtar lists the uid and the gid in columns 3 and 4.
          tar -tzvf "dist/$ARCHIVE" --numeric-owner
          if tar -tzvf "dist/$ARCHIVE" --numeric-owner | awk '$3 != 0 || $4 != 0 { bad = 1 } END { exit !bad }'; then
            echo "::error::$ARCHIVE has files not owned by 0/0"
            exit 1
          fi
          files=$(tar -tzf "dist/$ARCHIVE" | LC_ALL=C sort | tr '\n' ' ')
          if [ "$files" != "LICENSE ferry " ]; then
            echo "::error::$ARCHIVE holds $files, not LICENSE and ferry"
            exit 1
          fi
      # The commands of the docs (Install the CLI): this Mac picks this
      # archive, and the ferry in it runs.
      - name: Unpack and run
        run: |
          archive=ferry-$(uname -m | sed 's/arm64/aarch64/')-apple-darwin.tar.gz
          if [ "$archive" != "$ARCHIVE" ]; then
            echo "::error::on this Mac the docs download $archive, not $ARCHIVE"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "dist/$ARCHIVE" -C "$RUNNER_TEMP/bin" ferry
          printed=$("$RUNNER_TEMP/bin/ferry" --version)
          if [ "$printed" != "ferry $VERSION" ]; then
            echo "::error::the ferry of $ARCHIVE printed '$printed', not 'ferry $VERSION'"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # SHA256SUMS covers every archive: it waits for all the builds.
  assets:
    name: Checksums
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Write SHA256SUMS
        run: |
          for archive in $ARCHIVES; do
            [ -f "dist/$archive" ] || { echo "::error::$archive is missing"; exit 1; }
          done
          for file in dist/*; do
            case " $ARCHIVES " in
              *" ${file#dist/} "*) ;;
              *) echo "::error::${file#dist/} is not in ARCHIVES"; exit 1 ;;
            esac
          done
          cp install.sh dist/
          # shellcheck disable=SC2086 # one word per archive
          (cd dist && sha256sum $ARCHIVES install.sh > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  # A runner of its own: the build already ran a ferryd there, and its Docker
  # resources would block a second server.
  install:
    name: Install — Ubuntu ${{ matrix.ubuntu }} ${{ matrix.cpu }}
    needs: assets
    strategy:
      fail-fast: false
      # The oldest and the newest Ubuntu the script installs on.
      matrix:
        include:
          - ubuntu: "22.04"
            cpu: x86_64
            runner: ubuntu-22.04
          - ubuntu: "22.04"
            cpu: arm64
            runner: ubuntu-22.04-arm
          - ubuntu: "26.04"
            cpu: x86_64
            runner: ubuntu-26.04
          - ubuntu: "26.04"
            cpu: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - run: .github/scripts/install.test.sh dist
      - name: ferryd's log
        if: failure()
        run: sudo journalctl -u ferryd --no-pager -n 100 || true

  # The npm packages of the release assets, packed and installed with
  # `npm install -g` as a user installs them: npm picks the binary package of
  # this system, and the `ferry` command runs it.
  npm-check:
    name: npm — ${{ matrix.system }}
    needs: [plan, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Linux x86_64
            package: ferry-cli-linux-x64
            runner: ubuntu-22.04
          - system: Linux arm64
            package: ferry-cli-linux-arm64
            runner: ubuntu-22.04-arm
          - system: macOS arm64
            package: ferry-cli-darwin-arm64
            runner: macos-15
          - system: macOS x86_64
            package: ferry-cli-darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      # In this checkout only, as in the builds.
      - name: Set the version
        run: node .github/scripts/release.mjs set-version "$VERSION"
      - name: Stage the packages
        run: node .github/scripts/npm.mjs stage dist "$RUNNER_TEMP/npm"
      # npm refuses a package of another system named on its command line: only
      # this system's binary package goes next to ferry-cli. --ignore-scripts:
      # the packages have none, and ferry must work without them.
      - name: Pack and install
        run: |
          mkdir "$RUNNER_TEMP/packs"
          npm pack "$RUNNER_TEMP/npm/ferry-cli" "$RUNNER_TEMP/npm/$PACKAGE" --pack-destination "$RUNNER_TEMP/packs"
          npm install -g --prefix "$RUNNER_TEMP/global" --ignore-scripts \
            "$RUNNER_TEMP/packs/ferry-cli-$VERSION.tgz" "$RUNNER_TEMP/packs/$PACKAGE-$VERSION.tgz"
      - name: Run ferry
        run: |
          fail() { echo "::error::$1"; exit 1; }
          ferry="$RUNNER_TEMP/global/bin/ferry"
          printed=$("$ferry" --version)
          [ "$printed" = "ferry $VERSION" ] || fail "ferry --version printed '$printed', not 'ferry $VERSION'"
          for name in ferry-cli "$PACKAGE"; do
            version=$(node -p "require('$RUNNER_TEMP/global/lib/node_modules/$name/package.json').version")
            [ "$version" = "$VERSION" ] || fail "npm installed $name $version, not $VERSION"
          done
          # The exit code of ferry goes through the launcher: 2 for a usage error.
          status=0
          "$ferry" no-such-command 2> /dev/null || status=$?
          [ "$status" = 2 ] || fail "ferry no-such-command exited with $status, not 2"

  publish:
    name: Tag and publish
    needs: [plan, build, build-macos, assets, install, npm-check]
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # A draft gets its tag only when it is published: a failed upload
      # leaves no tag and no release with missing files.
      - name: Publish ${{ needs.plan.outputs.tag }}
        working-directory: artifacts/release-assets
        run: |
          # shellcheck disable=SC2086 # one word per archive
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file ../release-notes/notes.md $ARCHIVES install.sh SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
          echo "Published $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the draft
        if: failure() || cancelled()
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi

  # After the GitHub release: npm gets ferry-cli and its binary packages, made
  # from the same assets, when the CLI changed since the version npm has. A
  # release of the server only leaves npm as it is (npm.mjs plan). A re-run of
  # this job publishes only the packages npm does not have at this version yet.
  # The one-time npm setup: npm/README.md.
  npm:
    name: Publish to npm
    environment: prod
    needs: [plan, publish]
    if: github.event_name == 'push' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Trusted publishing (OIDC) and the provenance of each package.
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag of the version npm has
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Read when the job runs: a re-run of an old release sees that npm has a
      # newer ferry-cli, and does not move `latest` back.
      - name: Has the CLI changed?
        id: plan
        run: node .github/scripts/npm.mjs plan "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: Summary
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "::notice title=npm gets ferry-cli $VERSION::$REASON"
            { echo "## npm gets ferry-cli $VERSION"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=ferry-cli $VERSION not published::$REASON"
            { echo "## ferry-cli $VERSION not published"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Trusted publishing needs npm 11.5.1 or newer. Node 22 comes with npm 10.
      - name: Install npm 11
        if: steps.plan.outputs.publish == 'true'
        run: |
          npm install -g npm@11.6.2
          npm --version
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Set the version
        if: steps.plan.outputs.publish == 'true'
        run: node .github/scripts/release.mjs set-version "$VERSION"
      - name: Stage the packages
        if: steps.plan.outputs.publish == 'true'
        run: |
          (cd dist && sha256sum -c --ignore-missing SHA256SUMS)
          node .github/scripts/npm.mjs stage dist "$RUNNER_TEMP/npm"
      - name: Publish ferry-cli ${{ needs.plan.outputs.version }}
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing needs no token. Without it (the first publish of
          # a package), npm uses the NPM_TOKEN secret: the file names the
          # variable, not the token.
          if [ -n "$NPM_TOKEN" ]; then
            # shellcheck disable=SC2016 # npm reads ${NPM_TOKEN} itself
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          node .github/scripts/npm.mjs publish "$RUNNER_TEMP/npm"
          echo "Published https://www.npmjs.com/package/ferry-cli/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
